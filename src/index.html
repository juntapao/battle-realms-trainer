<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle Realms Trainer</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Battle Realms Trainer</h1>
      <p class="lead">Select an Excel file and apply clan trainer settings.</p>

      <form id="update-form" class="form">
        <div class="field-group">
          <label for="clan">Clan</label>
          <select id="clan" name="clan" required>
            <option value="" selected>- Select Clan -</option>
            <option value="0">Dragon</option>
            <option value="2">Lotus</option>
            <option value="3">Serpent</option>
            <option value="5">Wolf</option>
          </select>
        </div>

        <div class="field-group">
          <label class="checkbox-label" for="instant-peasant-generation">
            <input id="instant-peasant-generation" name="instantPeasantGeneration" type="checkbox" />
            Instant Peasant Generation
          </label>
        </div>

        <div class="field-group">
          <label class="checkbox-label" for="high-capacity-peasant">
            <input id="high-capacity-peasant" name="highCapacityPeasant" type="checkbox" />
            High Capacity Peasant Resource
          </label>
        </div>

        <div class="field-group">
          <label class="checkbox-label" for="town-square-yin-yang-multiplier">
            <input id="town-square-yin-yang-multiplier" name="townSquareYinYangMultiplier" type="checkbox" />
            Town Square Yin-Yang Multiplier
          </label>
        </div>

        <div class="field-group">
          <label class="checkbox-label" for="fast-build">
            <input id="fast-build" name="fastBuild" type="checkbox" />
            Fast Build
          </label>
        </div>

        <div class="field-group">
          <label class="checkbox-label" for="cheap-training">
            <input id="cheap-training" name="cheapTraining" type="checkbox" />
            Cheap Training
          </label>
        </div>

        <div class="field-group">
          <label class="checkbox-label" for="fast-training">
            <input id="fast-training" name="fastTraining" type="checkbox" />
            Fast Training
          </label>
        </div>

        <button type="submit" class="submit">Apply Trainer Settings</button>
      </form>

      <p id="status" class="status" data-tone="info">Ready.</p>
    </main>

    <script src="js/renderer.js"></script>
  </body>
</html>
